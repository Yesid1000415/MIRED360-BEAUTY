name: Build MIRED360 Beauty APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "auth.css"
      - "auth.js"
      - "app.js"
      - "admin.js"
      - "superadmin.js"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www
          cp index.html styles.css auth.css auth.js app.js admin.js superadmin.js www/

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MIRED360-Beauty.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MIRED360-Beauty-APK
          path: MIRED360-Beauty.apk
          if-no-files-found: error
          retention-days: 30
