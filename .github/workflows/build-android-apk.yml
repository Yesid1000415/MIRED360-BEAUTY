name: Build MIRED360 Beauty APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "**.css"
      - "**.js"
      - "**.svg"
      - "**.webmanifest"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare isolated Android build
        run: |
          mkdir -p "$RUNNER_TEMP/beauty-build/www"
          cp package.json capacitor.config.json "$RUNNER_TEMP/beauty-build/"
          cp *.html *.css *.js *.svg *.webmanifest "$RUNNER_TEMP/beauty-build/www/"
      - name: Install dependencies
        working-directory: ${{ runner.temp }}/beauty-build
        run: npm install
      - name: Create and sync Android project
        working-directory: ${{ runner.temp }}/beauty-build
        run: |
          npx cap add android
          npx cap sync android
      - name: Build installable APK
        working-directory: ${{ runner.temp }}/beauty-build/android
        run: ./gradlew assembleDebug
      - name: Package APK and build reference
        run: |
          cp "$RUNNER_TEMP/beauty-build/android/app/build/outputs/apk/debug/app-debug.apk" MIRED360-Beauty-Actualizada.apk
          sha256sum MIRED360-Beauty-Actualizada.apk > SHA256SUMS.txt
          git rev-parse HEAD > SOURCE_COMMIT.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MIRED360-Beauty-APK
          path: |
            MIRED360-Beauty-Actualizada.apk
            SHA256SUMS.txt
            SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 30
